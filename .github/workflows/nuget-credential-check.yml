name: Check current NuGet credential
run-name: Check current NuGet credential without publishing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'IoTSharp/SonnetDB' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify current credential against an existing package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./eng/check-nuget-credential.ps1
      - name: Retain credential result without secret material
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-credential-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nuget-credential-check.json
          if-no-files-found: error
