name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version to build and validate without publishing, for example 4.0.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  nuget:
    name: NuGet Packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:CANDIDATE_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') { throw 'A valid release version is required.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify release artifact validator
        shell: pwsh
        run: ./eng/test-release-artifacts.ps1

      - name: Require all release readiness evidence before tagged publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/verify-release-readiness.ps1 -Repository $env:GITHUB_REPOSITORY -CommitSha $env:GITHUB_SHA -Token $env:GITHUB_TOKEN -OutputPath artifacts/release-readiness.json

      - name: Upload release readiness evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness
          path: artifacts/release-readiness.json
          if-no-files-found: error

      - name: Pack NuGet packages
        shell: pwsh
        run: ./eng/release.ps1 -Tasks nuget -Version '${{ steps.version.outputs.version }}'

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/release/nuget/*
          if-no-files-found: error

  bundles:
    name: Release Bundles (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: nuget
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux AOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Install nFPM
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: npm install --global @goreleaser/nfpm

      - name: Install WiX
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          dotnet tool install --tool-path ./.tools wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path ./.tools)

      - name: Download candidate NuGet packages
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/release/nuget

      - name: Build bundles and installers
        shell: pwsh
        run: ./eng/release.ps1 -Tasks bundles,installers -Version '${{ needs.nuget.outputs.version }}' -Rid '${{ matrix.rid }}' -BuildAdminUi

      - name: Verify installed INSERT RETURNING contract and published compatibility
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { 'SonnetDB.exe' } else { 'SonnetDB' }
          ./eng/verify-insert-returning-package.ps1 `
            -Version '${{ needs.nuget.outputs.version }}' `
            -PackageSource artifacts/release/nuget `
            -ServerPath "artifacts/release/publish/${{ matrix.rid }}/server/$executable" `
            -OutputRoot 'artifacts/release-contract/${{ matrix.rid }}' `
            -VerifyPublishedBaseline

      - name: Upload INSERT RETURNING contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: insert-returning-contract-${{ matrix.rid }}
          path: |
            artifacts/release-contract/**/result.json
            artifacts/release-contract/**/*.log
          if-no-files-found: error

      - name: Verify Studio release artifacts
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $version = '${{ needs.nuget.outputs.version }}'
          $bundle = "artifacts/release/bundles/win-x64/sonnetdb-studio-$version-win-x64.zip"
          $installer = "artifacts/release/installers/win-x64/sonnetdb-studio-$version-win-x64.msi"
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Missing Studio bundle: $bundle" }
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing Studio installer: $installer" }
          Write-Host "Studio bundle and MSI verified: $version"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/release/bundles/${{ matrix.rid }}/*.zip
            artifacts/release/bundles/${{ matrix.rid }}/*.tar.gz
            artifacts/release/bundles/${{ matrix.rid }}/*.sha256
            artifacts/release/installers/${{ matrix.rid }}/*.msi
            artifacts/release/installers/${{ matrix.rid }}/*.deb
            artifacts/release/installers/${{ matrix.rid }}/*.rpm
            artifacts/release/installers/${{ matrix.rid }}/*.sha256
          if-no-files-found: error

  publish-nuget:
    name: Publish verified NuGet packages
    runs-on: ubuntu-latest
    needs: [nuget, bundles]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/verified-nuget
      - name: Publish to NuGet.org after both platform contracts pass
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NUGET_API_KEY is required for a tagged release.' }
          ./eng/verify-release-artifacts.ps1 -Stage nuget -Version '${{ needs.nuget.outputs.version }}' -ArtifactRoot artifacts/verified-nuget
          Get-ChildItem -LiteralPath artifacts/verified-nuget -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet publish failed: $($_.Name)" }
          }

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - nuget
      - bundles
      - publish-nuget
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts/release-upload

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.nuget.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="SonnetDB ${tag#v}"

          # 优先使用该版本的发行说明；缺失时回退到发布物总览页。
          notes_source="docs/releases/${VERSION}.md"
          if [ ! -f "$notes_source" ]; then
            notes_source="docs/releases/README.md"
          fi

          # 剥离 Jekyll YAML frontmatter（首个 --- 到第二个 --- 之间），避免在 Release 正文里显示为纯文本。
          notes_file="$(mktemp)"
          if [ "$(head -n 1 "$notes_source")" = "---" ]; then
            awk 'NR==1 && $0=="---" {infm=1; next} infm && $0=="---" {infm=0; next} !infm {print}' "$notes_source" > "$notes_file"
          else
            cp "$notes_source" "$notes_file"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "$title" --notes-file "$notes_file"
          else
            gh release edit "$tag" --notes-file "$notes_file"
          fi

          mapfile -t files < <(find artifacts/release-upload -type f \( \
            -name '*.nupkg' -o \
            -name '*.zip' -o \
            -name '*.tar.gz' -o \
            -name '*.msi' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.sha256' \
          \))

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          gh release upload "$tag" "${files[@]}" --clobber
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
