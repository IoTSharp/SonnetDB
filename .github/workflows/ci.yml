name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SonnetDB.slnx

      - name: Verify restored dependency licenses
        shell: pwsh
        run: ./eng/verify-dependency-licenses.ps1

      - name: Test release gate contracts
        shell: pwsh
        run: |
          ./eng/test-release-artifacts.ps1
          ./eng/test-release-network-defaults.ps1
          ./eng/test-release-readiness.ps1

      - name: Build
        run: dotnet build SonnetDB.slnx --configuration Release --no-restore /warnaserror

      - name: Test
        # 单项无进展时生成 mini dump 并失败退出；步骤上限为诊断产物上传预留时间。
        timeout-minutes: 50
        run: dotnet test SonnetDB.slnx --configuration Release --no-build -m:1 --logger trx --results-directory ./TestResults --blame-hang-timeout 10m --blame-hang-dump-type mini

      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          # 保留整个结果目录，包含 TRX、Sequence_*.xml 和挂起转储。
          path: ./TestResults
          if-no-files-found: error

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SonnetDB.slnx

      - name: Format check
        run: dotnet format SonnetDB.slnx --verify-no-changes --no-restore --severity warn --exclude extensions/

  aot-publish:
    name: AOT Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.rid }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rid }}-nuget-
            ${{ runner.os }}-nuget-

      - name: Publish SonnetDB.Cli (Native AOT)
        run: dotnet publish src/SonnetDB.Cli/SonnetDB.Cli.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true /warnaserror

      - name: Publish SonnetDB (Native AOT)
        run: dotnet publish src/SonnetDB/SonnetDB.csproj -c Release -r ${{ matrix.rid }} -p:SonnetDbPublishAot=true /warnaserror

      - name: Publish image codec smoke (Native AOT)
        run: dotnet publish eng/tools/image-codec-smoke/ImageCodecSmoke.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true /warnaserror -o artifacts/image-codec-smoke/${{ matrix.rid }}

      - name: Verify restored dependency licenses
        shell: pwsh
        run: ./eng/verify-dependency-licenses.ps1

      - name: Run image codec smoke (Native AOT)
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { 'ImageCodecSmoke.exe' } else { 'ImageCodecSmoke' }
          & (Join-Path 'artifacts/image-codec-smoke/${{ matrix.rid }}' $executable)
          if ($LASTEXITCODE -ne 0) { throw "Image codec Native AOT smoke failed with exit code $LASTEXITCODE." }

      - name: Show AOT artifacts
        shell: bash
        run: |
          echo "==== SonnetDB.Cli ===="
          ls -lh src/SonnetDB.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/ || true
          echo "==== SonnetDB ===="
          ls -lh src/SonnetDB/bin/Release/net10.0/${{ matrix.rid }}/publish/ || true

      - name: Upload AOT artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aot-${{ matrix.rid }}
          path: |
            src/SonnetDB.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/
            src/SonnetDB/bin/Release/net10.0/${{ matrix.rid }}/publish/
